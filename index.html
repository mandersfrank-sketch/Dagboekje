<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitaal Dagboek</title>
    <meta name="description" content="Een overzichtelijk digitaal dagboekje om dagelijkse entries met stemming en reflectievragen vast te leggen." />
    <meta property="og:title" content="Digitaal Dagboek" />
    <meta property="og:description" content="Een overzichtelijk digitaal dagboekje om dagelijkse entries met stemming en reflectievragen vast te leggen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('dagboek_theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f7f4ee] dark:bg-[#191411] text-[#2d2218] dark:text-[#fffdfa] antialiased selection:bg-[#cfa373]/60 selection:text-[#163f57] min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
